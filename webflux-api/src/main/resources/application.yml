spring:
  application:
    name: webflux-api
  # Adicione o bloco do Redis:
  data:
    redis:
      host: localhost
      port: 6379
  
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/webflux_db
    username: admin
    password: admin_password
    pool:
      initial-size: 5
      max-size: 20
    # Configuração correta para o spring.r2dbc...
    show-sql: true

  # sql precisa estar dentro de spring
  sql:
    init:
      mode: always

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  
logging:
  level:
    org.springframework.r2dbc: DEBUG